<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="INNOEQX — Consultoría SAP y tecnología para Centroamérica. SAP and technology consulting for Central America.">
<title>INNOEQX | Consultoría SAP y tecnología · SAP &amp; technology consulting</title>
<style>
:root{
  --bg:#F5F7FB;--paper:#FFFFFF;--text:#0B1324;--muted:#566178;--line:#E1E7F0;--soft:#EDF2F8;
  --ink:#070D1A;--ink-2:#0D1729;--ink-3:#142039;--on-ink:#EAF0FA;--on-ink-muted:#9DAAC2;--ink-line:#213050;
  --brand:#10B8A6;--brand-strong:#0A8478;--blue:#3B82F6;--lime:#B6F24A;--violet:#8B5CF6;
  --grad:linear-gradient(100deg,#38BDF8 0%,#10B8A6 48%,#B6F24A 100%);
  --shadow:0 12px 32px -14px rgba(11,19,36,.22);
  --font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0A1120;--paper:#101A2E;--text:#E8EEF8;--muted:#A4B2C9;--line:#22314D;--soft:#0D1627;--brand-strong:#3DDBC8;--shadow:0 12px 32px -14px rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-block-start:84px}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg{display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.container{max-inline-size:1200px;margin-inline:auto;padding-inline:clamp(20px,4vw,40px)}
.skip{position:absolute;inset-inline-start:16px;inset-block-start:-80px;z-index:100;background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-weight:700}
.skip:focus{inset-block-start:12px}

/* boot */
.boot{min-block-size:100vh;display:grid;place-content:center;text-align:center;background:var(--ink);color:var(--on-ink-muted);gap:6px}
.boot-logo{font-size:40px;font-weight:800;letter-spacing:-.03em;color:#fff}
.boot-logo span,.logo .x{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
.header{position:fixed;inset-inline:0;inset-block-start:0;z-index:50;color:var(--on-ink);transition:background .3s,box-shadow .3s}
.header.scrolled,.header.open{background:rgba(7,13,26,.86);-webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);box-shadow:0 1px 0 var(--ink-line)}
.bar{display:flex;align-items:center;gap:28px;block-size:72px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.03em;color:#fff}
.logo-mark{inline-size:32px;block-size:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(16,184,166,.8)}
.logo-mark i{inline-size:12px;block-size:12px;border:2.5px solid #04121A;border-radius:3px;transform:rotate(45deg)}
.nav{display:flex;gap:26px;margin-inline-start:auto}
.nav a{font-size:14.5px;font-weight:550;color:var(--on-ink-muted);transition:color .2s;position:relative;padding-block:6px}
.nav a::after{content:"";position:absolute;inset-inline:0;inset-block-end:0;block-size:2px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.nav a:hover{color:#fff}
.nav a:hover::after{transform:scaleX(1)}
.actions{display:flex;align-items:center;gap:12px}
.menu-btn{display:none;inline-size:44px;block-size:44px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;place-items:center}
.menu-btn svg{inline-size:22px;block-size:22px}
.drawer{position:fixed;inset-inline:0;inset-block-start:72px;background:rgba(7,13,26,.97);padding:12px clamp(20px,4vw,40px) 28px;display:grid;border-block-end:1px solid var(--ink-line);animation:fadeUp .25s both}
.drawer a{padding:14px 0;border-block-end:1px solid var(--ink-line);color:var(--on-ink);font-size:17px;font-weight:600}
.drawer .btn{margin-block-start:18px;justify-content:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:650;font-size:15px;border:1px solid transparent;transition:transform .2s,box-shadow .2s,background .2s,gap .2s;white-space:nowrap}
.btn svg{inline-size:18px;block-size:18px}
.btn:hover{gap:12px}
.btn-primary{background:var(--grad);color:#04121A;box-shadow:0 10px 26px -10px rgba(16,184,166,.75)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 32px -12px rgba(16,184,166,.85)}
.btn-ghost{border-color:rgba(255,255,255,.22);color:var(--on-ink);background:rgba(255,255,255,.04)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-sm{padding:9px 16px;font-size:14px}

/* language toggle */
.lang{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.lang button{position:relative;z-index:1;border:0;background:none;color:var(--on-ink-muted);font-weight:750;font-size:13px;padding:6px 13px;border-radius:999px;letter-spacing:.05em;transition:color .3s}
.lang button[aria-pressed="true"]{color:#04121A}
.lang .thumb{position:absolute;inset-block:4px;inset-inline-start:4px;inline-size:calc(50% - 4px);border-radius:999px;background:#fff;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.lang[data-lang="en"] .thumb{transform:translateX(100%)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--on-ink);padding-block:150px 84px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-10%;z-index:-2;background:radial-gradient(560px 380px at 14% 22%,rgba(56,189,248,.26),transparent 62%),radial-gradient(680px 480px at 86% 28%,rgba(16,184,166,.30),transparent 62%),radial-gradient(620px 420px at 55% 105%,rgba(139,92,246,.24),transparent 62%);animation:drift 18s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%)}
.hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:600}
.pulse-dot{inline-size:8px;block-size:8px;border-radius:50%;background:var(--lime);animation:pulse 2.2s infinite}
.hero h1{font-size:clamp(40px,5.5vw,70px);line-height:1.04;letter-spacing:-.035em;font-weight:760;margin:22px 0}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,1.35vw,19px);color:var(--on-ink-muted);max-inline-size:600px;margin:0}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px;margin-block-start:34px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-block-start:56px;border-block-start:1px solid var(--ink-line)}
.hero-stats div{padding-block-start:18px;padding-inline-end:14px}
.hero-stats b{display:block;font-size:28px;letter-spacing:-.02em;color:#fff}
.hero-stats span{font-size:13px;color:var(--on-ink-muted)}

/* orbit visual */
.orbit{position:relative;inline-size:100%;max-inline-size:500px;aspect-ratio:1;margin-inline:auto;container-type:inline-size}
.ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,255,255,.13)}
.ring.r2{inset:14%;border-color:rgba(255,255,255,.1)}
.ring.r3{inset:29%;border-style:solid;border-color:rgba(16,184,166,.35)}
.core{position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle at 30% 28%,#27E0CB,#0B6C8C 72%);display:grid;place-items:center;text-align:center;box-shadow:0 0 90px rgba(16,184,166,.5),inset 0 0 30px rgba(255,255,255,.18);color:#fff}
.core b{display:block;font-size:clamp(15px,4.4cqw,22px);letter-spacing:-.01em}
.core small{display:block;font-size:clamp(10px,2.6cqw,12px);opacity:.85;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.spin{position:absolute;inset:0;animation:spin 48s linear infinite}
.node{position:absolute;inset-block-start:50%;inset-inline-start:50%;--r:180px;--r:36cqw;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--r)) rotate(calc(var(--a) * -1))}
.chip-n{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(13,23,41,.88);border:1px solid rgba(255,255,255,.15);font-size:13px;font-weight:650;white-space:nowrap;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);animation:spin 48s linear infinite reverse}
.chip-n svg{inline-size:16px;block-size:16px;color:var(--lime)}
.glass{position:absolute;inset-inline-start:-4%;inset-block-end:2%;padding:14px 16px;border-radius:16px;background:rgba(13,23,41,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);inline-size:min(250px,62%);animation:float 6s ease-in-out infinite}
.glass b{font-size:13px;display:block}
.glass span{font-size:12px;color:var(--on-ink-muted)}
.bars{display:flex;gap:4px;margin-block-start:10px}
.bars i{flex:1;block-size:6px;border-radius:4px;background:rgba(255,255,255,.12)}
.bars i.on{background:var(--grad)}

/* marquee */
.marquee{background:var(--ink-2);border-block:1px solid var(--ink-line);overflow:hidden;color:var(--on-ink-muted)}
.track{display:flex;inline-size:max-content;animation:marq 46s linear infinite}
.track span{display:inline-flex;align-items:center;gap:22px;padding-block:18px;padding-inline-end:22px;font-weight:600;font-size:15px;white-space:nowrap}
.track span::after{content:"";inline-size:6px;block-size:6px;border-radius:50%;background:var(--brand)}
.marquee:hover .track{animation-play-state:paused}

/* sections */
.section{padding-block:clamp(76px,9vw,120px)}
.section.dark{background:var(--ink);color:var(--on-ink)}
.section.soft{background:var(--soft)}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-strong)}
.kicker::before{content:"";inline-size:24px;block-size:2px;background:currentColor}
.dark .kicker{color:var(--lime)}
h2{font-size:clamp(32px,3.8vw,50px);line-height:1.08;letter-spacing:-.03em;margin:14px 0 16px;font-weight:740}
.sub{font-size:18px;color:var(--muted);max-inline-size:690px;margin:0}
.dark .sub{color:var(--on-ink-muted)}
.section-head{margin-block-end:48px}
.section-head.center{text-align:center}
.section-head.center .sub{margin-inline:auto}
.section-head.split{display:flex;justify-content:space-between;align-items:end;gap:32px;flex-wrap:wrap}

/* offers */
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.offer{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s;overflow:hidden}
.offer::before{content:"";position:absolute;inset-inline:0;inset-block-start:0;block-size:4px;background:var(--grad)}
.offer:hover{transform:translateY(-6px);box-shadow:0 26px 50px -22px rgba(11,19,36,.35)}
.offer-top{display:flex;justify-content:space-between;align-items:center}
.offer .num{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--line)}
.tag{font-size:12px;font-weight:750;padding:5px 12px;border-radius:999px;background:rgba(16,184,166,.12);color:var(--brand-strong)}
.offer h3{font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.2}
.offer .for{color:var(--muted);font-size:15px;margin:0}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.checks li{display:flex;gap:10px;font-size:15px;line-height:1.45}
.checks svg{flex:none;inline-size:20px;block-size:20px;color:var(--brand)}
.offer .next{margin-block-start:auto;padding-block-start:16px;border-block-start:1px solid var(--line);font-size:14px;color:var(--muted)}
.link-arrow{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--brand-strong);transition:gap .2s;font-size:15px}
.link-arrow svg{inline-size:18px;block-size:18px}
.link-arrow:hover{gap:11px}
.fine{margin-block-start:30px;text-align:center;font-size:14px;color:var(--muted)}

/* services */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-block-end:34px}
.tab{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;border:1px solid var(--ink-line);background:rgba(255,255,255,.03);color:var(--on-ink-muted);font-weight:650;font-size:15px;transition:all .25s}
.tab svg{inline-size:20px;block-size:20px}
.tab:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 10px 30px -12px rgba(255,255,255,.35)}
.svc-panel{display:grid;grid-template-columns:.9fr 2fr;gap:28px;animation:fadeUp .5s ease both}
.svc-intro{padding:32px;border-radius:24px;background:linear-gradient(160deg,rgba(16,184,166,.2),rgba(59,130,246,.1) 60%,rgba(139,92,246,.12));border:1px solid var(--ink-line);display:flex;flex-direction:column;gap:14px}
.big-icon{inline-size:56px;block-size:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#04121A}
.big-icon svg{inline-size:28px;block-size:28px}
.svc-intro h3{font-size:28px;margin:0;letter-spacing:-.02em;line-height:1.15}
.svc-intro p{margin:0;color:var(--on-ink-muted)}
.svc-intro .count{margin-block-start:auto;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.svc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.svc{padding:24px;border-radius:20px;background:var(--ink-2);border:1px solid var(--ink-line);transition:all .25s}
.svc:hover{border-color:rgba(16,184,166,.65);transform:translateY(-3px);background:var(--ink-3)}
.svc .idx{font-size:13px;font-weight:750;color:var(--lime);letter-spacing:.06em}
.svc h4{margin:10px 0 8px;font-size:18px;letter-spacing:-.01em;line-height:1.3}
.svc p{margin:0;color:var(--on-ink-muted);font-size:15px}

/* industries */
.ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ind{position:relative;padding:28px;border-radius:22px;background:var(--paper);border:1px solid var(--line);overflow:hidden;transition:all .3s;display:flex;flex-direction:column}
.ind::after{content:"";position:absolute;inset-inline-end:-60px;inset-block-start:-60px;inline-size:160px;block-size:160px;border-radius:50%;background:radial-gradient(circle,rgba(16,184,166,.16),transparent 70%);transition:transform .5s}
.ind:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-4px)}
.ind:hover::after{transform:scale(1.6)}
.ic{inline-size:48px;block-size:48px;border-radius:14px;display:grid;place-items:center;background:rgba(16,184,166,.12);color:var(--brand-strong);margin-block-end:18px}
.ic svg{inline-size:24px;block-size:24px}
.ind h3{font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
.mini{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-block-end:4px}
.ind p{margin:0 0 14px;font-size:15px}
.ind .ch{color:var(--muted)}
.ind .hp{margin-block:auto 0;padding-block-start:14px;border-block-start:1px dashed var(--line);font-weight:600}

/* approach */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;position:relative}
.steps::before{content:"";position:absolute;inset-block-start:28px;inset-inline:6%;block-size:2px;background:linear-gradient(90deg,var(--brand),var(--blue),var(--violet));opacity:.45}
.step .dot{inline-size:56px;block-size:56px;border-radius:50%;background:var(--paper);border:2px solid var(--brand);display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--brand-strong);box-shadow:0 0 0 8px var(--soft);position:relative;z-index:1;transition:transform .3s}
.step:hover .dot{transform:scale(1.08);background:var(--brand);color:#fff}
.step h3{margin:22px 0 8px;font-size:21px;letter-spacing:-.01em}
.step p{margin:0;color:var(--muted);font-size:15px}
.gov{margin-block-start:52px;display:flex;gap:18px;align-items:center;padding:22px 26px;border-radius:18px;background:var(--paper);border:1px solid var(--line)}
.gov .ic{margin:0;flex:none}
.gov p{margin:0;font-size:16px}

/* region */
.region{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.map{position:relative;border-radius:28px;background:radial-gradient(circle at 25% 18%,rgba(16,184,166,.18),transparent 60%),var(--ink-2);border:1px solid var(--ink-line);padding:18px}
.map svg{inline-size:100%;block-size:auto}
.map .isthmus{fill:none;stroke:rgba(16,184,166,.1);stroke-width:64;stroke-linecap:round;stroke-linejoin:round}
.map .link{stroke:rgba(255,255,255,.22);stroke-width:1.5;stroke-dasharray:4 7;animation:dash 12s linear infinite}
.cnode{cursor:pointer}
.cnode .core-dot{fill:var(--ink-3);stroke:var(--brand);stroke-width:2.5;transition:all .3s}
.cnode .halo{fill:rgba(16,184,166,.18);opacity:0}
.cnode text{fill:var(--on-ink-muted);font-size:15px;font-weight:650;font-family:var(--font);transition:fill .3s}
.cnode:hover text{fill:#fff}
.cnode.sel .core-dot{fill:var(--lime);stroke:#fff}
.cnode.sel .halo{opacity:1;animation:halo 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.cnode.sel text{fill:#fff;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block-start:16px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--ink-line);background:transparent;color:var(--on-ink-muted);font-size:14px;font-weight:650;transition:all .2s}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.35)}
.chip[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.cpanel{padding:34px;border-radius:24px;background:rgba(255,255,255,.035);border:1px solid var(--ink-line);animation:fadeUp .45s both}
.cpanel .mini{color:var(--on-ink-muted)}
.cpanel h3{font-size:36px;margin:4px 0 18px;letter-spacing:-.025em}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topic{padding:8px 14px;border-radius:999px;background:rgba(16,184,166,.14);border:1px solid rgba(16,184,166,.38);font-size:14px;font-weight:650}
.startbox{margin-block-start:24px;padding:20px;border-radius:16px;background:var(--ink-3);border:1px solid var(--ink-line)}
.startbox p{margin:0;font-size:17px;font-weight:650;color:#fff}
.region-note{margin-block-start:18px;font-size:13.5px;color:var(--on-ink-muted)}

/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.quote{font-size:clamp(24px,2.5vw,33px);line-height:1.3;letter-spacing:-.02em;font-weight:650;margin:0}
.quote::before{content:"\201C";display:block;font-size:84px;line-height:.7;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-block-end:10px}
.about-body{color:var(--muted);font-size:17px;margin-block-start:24px}
.principles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pr{padding:22px;border-radius:18px;background:var(--paper);border:1px solid var(--line);transition:all .25s}
.pr:hover{border-color:var(--brand);transform:translateY(-3px)}
.pr .n{font-size:12px;font-weight:800;color:var(--brand-strong);letter-spacing:.08em}
.pr h4{margin:6px 0 6px;font-size:17px}
.pr p{margin:0;color:var(--muted);font-size:14.5px}

/* faq */
.faq{max-inline-size:860px;margin-inline:auto}
.qa{border-block-end:1px solid var(--line)}
.qa button{inline-size:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;background:none;border:0;color:var(--text);font-size:19px;font-weight:680;text-align:start;letter-spacing:-.01em}
.pm{flex:none;inline-size:38px;block-size:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s,background .3s,color .3s}
.pm svg{inline-size:18px;block-size:18px}
.qa[data-open="true"] .pm{transform:rotate(45deg);background:var(--text);color:var(--bg);border-color:var(--text)}
.ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.qa[data-open="true"] .ans{grid-template-rows:1fr}
.ans>div{overflow:hidden}
.ans p{margin:0 0 24px;color:var(--muted);font-size:16.5px;max-inline-size:760px}

/* contact */
.contact{position:relative;overflow:hidden;isolation:isolate}
.contact::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% 10%,rgba(16,184,166,.22),transparent 60%),radial-gradient(600px 400px at 95% 90%,rgba(59,130,246,.2),transparent 60%)}
.contact-wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.expect{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:14px}
.expect li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.expect svg{flex:none;inline-size:22px;block-size:22px;color:var(--lime)}
.form{padding:32px;border-radius:26px;background:var(--paper);color:var(--text);box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(16,184,166,.18)}
.field textarea{min-block-size:110px;resize:vertical}
.form .btn{margin-block-start:22px;inline-size:100%;justify-content:center}
.form-note{margin:14px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.sent{text-align:center;padding:36px 10px;animation:fadeUp .4s both}
.sent .ok{inline-size:68px;block-size:68px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto 18px;color:#04121A}
.sent .ok svg{inline-size:32px;block-size:32px}
.sent h3{font-size:24px;margin:0 0 8px}
.sent p{color:var(--muted);margin:0 0 18px}
.sent button{background:none;border:1px solid var(--line);border-radius:999px;padding:9px 18px;color:var(--text);font-weight:650}

/* footer */
.footer{background:#050A14;color:var(--on-ink-muted);padding-block:64px 32px;font-size:14px}
.f-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}
.f-grid h5{color:#fff;font-size:14px;margin:0 0 14px}
.f-grid ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.f-grid a:hover{color:#fff}
.f-tag{margin:16px 0 20px;max-inline-size:320px}
.f-bottom{margin-block-start:48px;padding-block-start:24px;border-block-start:1px solid var(--ink-line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:12.5px}
.tm{max-inline-size:760px;margin:0}

/* motion */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .75s ease,transform .75s ease}
.reveal.in{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}.d5{transition-delay:.4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(182,242,74,.55)}60%{box-shadow:0 0 0 9px rgba(182,242,74,0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(3%,-3%,0) scale(1.05)}}
@keyframes dash{to{stroke-dashoffset:-220}}
@keyframes halo{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}

/* responsive */
@media (max-width:1140px){
  .nav,.cta-desktop{display:none}
  .menu-btn{display:inline-grid}
  .actions{margin-inline-start:auto}
  .hero-grid,.svc-panel,.region,.about,.contact-wrap{grid-template-columns:1fr}
  .orbit{max-inline-size:440px}
  .offers{grid-template-columns:1fr;max-inline-size:640px;margin-inline:auto}
  .ind-grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr);row-gap:40px}
  .steps::before{display:none}
  .f-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .hero{padding-block:118px 64px}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .svc-grid,.ind-grid,.principles,.form-grid,.steps,.f-grid{grid-template-columns:1fr}
  .qa button{font-size:17px}
  .form,.cpanel,.svc-intro{padding:24px}
  .glass{display:none}
  .chip-n{font-size:11.5px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
}
@media print{
  .header,.marquee,.drawer,.skip{display:none!important}
  .reveal{opacity:1!important;transform:none!important}
  .hero{padding-block:40px}
  .section{padding-block:36px}
  .offer,.svc,.ind,.pr,.step{break-inside:avoid}
}
