<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="INNOEQX Service Opportunity Report for Central America: service ideas, flagship offers, country playbook and 12-month roadmap. Informe de oportunidades de servicio.">
<title>INNOEQX | Service Opportunity Report · Central America</title>
<style>
:root{
  --bg:#F4F2EC;--paper:#FFFEFA;--text:#122022;--muted:#56625F;--line:#D6DAD2;--soft:#E9EEE6;
  --ink:#0B1A1C;--ink-2:#12272A;--on-ink:#F1F5EC;--on-ink-muted:#AFC0B8;--ink-line:#28413F;
  --accent:#0B7A6E;--accent-2:#1D4ED8;--lime:#C9F06B;--warn:#B45309;
  --grad:linear-gradient(100deg,#38BDF8 0%,#10B8A6 48%,#B6F24A 100%);
  --radius:18px;--shadow:0 10px 28px -16px rgba(18,32,34,.28);
  --font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0C1617;--paper:#132224;--text:#EEF3EA;--muted:#B3C2BB;--line:#2E4744;--soft:#172B2C;--accent:#5EE0CF;--accent-2:#93B4FF;--warn:#F5B35A;--shadow:0 10px 28px -16px rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-block-start:120px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.62 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px;border-radius:6px}
svg{display:block}
.wrap{max-inline-size:1240px;margin-inline:auto;padding-inline:clamp(20px,4vw,56px)}
.skip{position:absolute;inset-inline-start:16px;inset-block-start:-80px;z-index:100;background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-weight:700}
.skip:focus{inset-block-start:12px}
.boot{min-block-size:100vh;display:grid;place-content:center;text-align:center;background:var(--ink);color:var(--on-ink-muted);gap:6px}
.boot-logo{font-size:40px;font-weight:800;letter-spacing:-.03em;color:#fff}
.boot-logo span,.brand .x{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* top bar */
.top{position:sticky;inset-block-start:0;z-index:40;background:rgba(11,26,28,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--on-ink);border-block-end:1px solid var(--ink-line)}
.top .row{display:flex;align-items:center;gap:18px;block-size:62px}
.brand{font-size:21px;font-weight:850;letter-spacing:-.03em;color:#fff;text-decoration:none}
.top .label{color:var(--on-ink-muted);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.top .grow{flex:1}
.lang{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.lang button{position:relative;z-index:1;border:0;background:none;color:var(--on-ink-muted);font-weight:750;font-size:13px;padding:5px 13px;border-radius:999px;letter-spacing:.05em;cursor:pointer;transition:color .3s}
.lang button[aria-pressed="true"]{color:#04121A}
.lang .thumb{position:absolute;inset-block:4px;inset-inline-start:4px;inline-size:calc(50% - 4px);border-radius:999px;background:#fff;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.lang[data-lang="es"] .thumb{transform:translateX(100%)}
.pbtn{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--on-ink);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:650;cursor:pointer}
.pbtn:hover{background:rgba(255,255,255,.08)}
.nav{position:sticky;inset-block-start:62px;z-index:39;background:var(--paper);border-block-end:1px solid var(--line)}
.nav .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-block:8px}
.nav a{flex:none;font-size:13px;font-weight:650;color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:999px;white-space:nowrap}
.nav a:hover{background:var(--soft);color:var(--text)}
.nav a b{color:var(--accent);margin-inline-end:5px;font-weight:800}

/* cover */
.cover{position:relative;overflow:hidden;background:var(--ink);color:var(--on-ink);padding-block:64px 56px;isolation:isolate}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(640px 420px at 88% 10%,rgba(16,184,166,.28),transparent 62%),radial-gradient(520px 380px at 8% 100%,rgba(56,189,248,.18),transparent 62%)}
.cover .meta{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.cover h1{font-size:clamp(36px,5vw,66px);line-height:1.05;letter-spacing:-.035em;font-weight:720;margin:18px 0 20px;max-inline-size:1000px}
.cover h1 em{font-family:var(--serif);font-weight:400;font-style:italic;color:var(--lime)}
.cover .lede{font-size:clamp(17px,1.5vw,20px);color:var(--on-ink-muted);max-inline-size:760px;margin:0}
.cover-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:end}
.decision{border:1px solid var(--ink-line);background:rgba(255,255,255,.04);border-radius:20px;padding:24px}
.decision .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.decision h2{font-size:22px;line-height:1.3;margin:10px 0 8px;letter-spacing:-.01em;color:#fff}
.decision p{margin:0;color:var(--on-ink-muted);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);margin-block-start:44px;border-block-start:1px solid var(--ink-line)}
.kpi{padding:18px 16px 0 0}
.kpi b{display:block;font-size:34px;letter-spacing:-.03em;line-height:1.1;color:#fff}
.kpi span{font-size:13px;color:var(--on-ink-muted)}
.scope{margin-block-start:30px;font-size:13px;color:var(--on-ink-muted);border:1px solid var(--ink-line);border-radius:12px;padding:14px 18px}
.scope strong{color:#fff}

/* sections */
.section{padding-block:64px;border-block-end:1px solid var(--line)}
.shead{display:grid;grid-template-columns:72px 1fr;gap:16px;margin-block-end:32px}
.num{font:italic 38px/1 var(--serif);color:var(--accent)}
h2{font-size:clamp(28px,3vw,42px);letter-spacing:-.025em;line-height:1.15;margin:0 0 12px;font-weight:720}
h3{font-size:20px;letter-spacing:-.01em;line-height:1.3;margin:0 0 10px}
.shead p{margin:0;color:var(--muted);max-inline-size:820px;font-size:17px}
.muted{color:var(--muted)}
.note{border-inline-start:3px solid var(--accent);padding-inline-start:16px;color:var(--muted);font-size:14px;margin-block:24px 0}
.ref{font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.panel p:last-child{margin-block-end:0}
.panel .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.msg h3{font-size:22px;margin-block-start:10px}
.msg .n{font:italic 30px/1 var(--serif);color:var(--accent)}
.situation{font-size:18px;max-inline-size:900px;margin:0 0 28px}
.decide{margin-block-start:26px;background:var(--ink);color:var(--on-ink);border-radius:22px;padding:clamp(22px,3vw,36px)}
.decide .k{color:var(--lime);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.decide h3{font:clamp(24px,2.6vw,34px)/1.2 var(--serif);margin:12px 0 18px;color:#fff}
.decide ol{margin:0;padding-inline-start:22px;display:grid;gap:8px;color:var(--on-ink)}
.decide li::marker{color:var(--lime);font-weight:800}

/* signals */
.signals{display:grid;gap:14px}
.signal{display:grid;grid-template-columns:1.1fr 1fr .8fr;gap:22px;padding:20px 22px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.signal .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-block-end:6px}
.signal h3{font-size:17px;margin:0 0 6px}
.signal p{margin:0;font-size:15px}
.idchips{display:flex;flex-wrap:wrap;gap:6px}
.idchip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--text);cursor:pointer}
.idchip:hover{border-color:var(--accent);color:var(--accent)}

/* map */
.mapgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}
.chart svg{inline-size:100%;block-size:auto}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .mid{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 5;opacity:.6}
.chart .ql{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;fill:var(--muted);font-family:var(--font)}
.chart .ql.hot{fill:var(--accent)}
.chart .axl{font-size:12px;fill:var(--muted);font-family:var(--font);font-weight:650}
.chart .tick{font-size:11px;fill:var(--muted);font-family:var(--font)}
.pt{cursor:pointer;transition:opacity .25s}
.pt circle{stroke:var(--paper);stroke-width:2;transition:r .2s}
.pt text{font-size:9.5px;font-weight:800;fill:#fff;font-family:var(--font);pointer-events:none}
.pt.dim{opacity:.13}
.pt.sel circle{stroke:var(--text);stroke-width:3}
.pt:hover circle,.pt:focus circle{stroke:var(--text)}
.pt:focus{outline:none}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:12px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer}
.lg i{inline-size:10px;block-size:10px;border-radius:50%}
.lg[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.detail{position:sticky;inset-block-start:130px}
.detail .fam{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.detail .fam i{inline-size:10px;block-size:10px;border-radius:50%}
.detail h3{font-size:22px;margin:10px 0}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:14px}
.score{background:var(--soft);border-radius:12px;padding:10px 12px}
.score span{display:block;font-size:11px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.score b{font-size:20px}
.dots{display:inline-flex;gap:3px;margin-inline-start:6px;vertical-align:middle}
.dots i{inline-size:8px;block-size:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.bars{display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 30px;gap:10px;align-items:center;font-size:13.5px}
.bartrack{block-size:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.barfill{block-size:100%;border-radius:6px}
.barrow b{text-align:end}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-block-start:24px}

/* catalog */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-block-end:14px}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-inline-size:160px}
.field.wide{flex:2;min-inline-size:240px}
.field label{font-size:12px;font-weight:750}
.field input,.field select{background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;inline-size:100%}
.btn2{border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:10px 16px;font-weight:650;cursor:pointer;white-space:nowrap}
.btn2:hover{border-color:var(--accent)}
.count{font-size:13.5px;color:var(--muted);margin:0 0 16px}
.catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;border-block-start:4px solid var(--c);transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card.flash{animation:flash 1.6s ease}
.card-h{display:block;inline-size:100%;text-align:start;background:none;border:0;color:inherit;padding:20px 22px;cursor:pointer}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-block-end:10px}
.cid{font:26px/1 var(--serif);color:var(--c)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;font-weight:750;border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.launch{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.famlabel{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card-h h3{font-size:19px;margin:6px 0 6px}
.card-h p{margin:0;font-size:14.5px;color:var(--muted)}
.more{display:inline-block;margin-block-start:10px;font-size:12.5px;font-weight:750;color:var(--accent)}
.card[data-open="false"] .card-b{display:none}
.card[data-hide="true"]{display:none}
.card-b{padding:0 22px 20px;font-size:14.5px;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.card-b div.full{grid-column:1/-1}
.card-b b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-block-end:2px}
.card-b p{margin:0}
.gate{background:var(--soft);border-radius:10px;padding:10px 12px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}

/* offers */
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.offer{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.offer::before{content:"";position:absolute;inset-inline:0;inset-block-start:0;block-size:4px;background:var(--grad)}
.offer .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.offer h3{font-size:21px;margin:0}
.offer .pitch{margin:0;color:var(--muted);font-size:15px}
.chain{display:grid;gap:8px;margin-block-start:4px}
.stage{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start;font-size:14px}
.stage .st{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 0;color:var(--muted)}
.stage.land .st{color:var(--accent-2)}.stage.expand .st{color:var(--accent)}.stage.run .st{color:var(--warn)}
.stage ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.stage li{padding:6px 10px;background:var(--soft);border-radius:8px}
.offer .why{margin-block-start:auto;padding-block-start:12px;border-block-start:1px solid var(--line);font-size:13px;color:var(--muted)}

/* heatmap */
.heat{inline-size:100%;border-collapse:separate;border-spacing:4px;font-size:13px}
.heat th{font-size:11px;font-weight:750;letter-spacing:.04em;color:var(--muted);text-align:center;padding:6px 4px;vertical-align:bottom}
.heat th.rowh{text-align:start;font-size:14px;color:var(--text);font-weight:700;letter-spacing:0;min-inline-size:170px}
.heat td{text-align:center;border-radius:8px;padding:12px 4px;font-weight:800;font-size:12px}
.h0{background:transparent;color:var(--muted)}
.h1{background:rgba(16,184,166,.12);color:var(--muted)}
.h2{background:rgba(16,184,166,.38);color:var(--text)}
.h3{background:#0B7A6E;color:#fff}
.heatwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px}
.hlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-block-start:12px}
.hlegend span{display:inline-flex;align-items:center;gap:6px}
.hlegend i{inline-size:16px;block-size:12px;border-radius:4px;display:inline-block}

/* countries */
.ctable{inline-size:100%;border-collapse:collapse;font-size:14.5px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ctable th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--soft);text-align:start;padding:12px 14px}
.ctable td{padding:16px 14px;border-block-start:1px solid var(--line);vertical-align:top}
.ctable td strong{display:block;font-size:16px}
.role{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;margin-block-start:6px;background:var(--soft);color:var(--muted)}
.role.r1{background:var(--accent);color:var(--paper)}
.role.r2{background:rgba(29,78,216,.14);color:var(--accent-2)}

/* revenue */
.flywheel{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--paper)}
.fw{padding:26px;border-inline-end:1px solid var(--line);position:relative}
.fw:last-child{border-inline-end:0}
.fw .big{font:44px/1 var(--serif);color:var(--accent)}
.fw .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fw h3{margin:10px 0 6px}
.fw ul{margin:12px 0 0;padding-inline-start:18px;font-size:14px;color:var(--muted)}
.fw ul li{padding-block:2px}
.list{padding-inline-start:20px;margin:0}
.list li{padding-block:4px}

/* roadmap */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.phase{padding:22px;background:var(--paper);border-inline-end:1px solid var(--line)}
.phase:last-child{border-inline-end:0}
.phase .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.phase h3{margin:10px 0 10px}
.phase ul{margin:0;padding-inline-start:18px;font-size:14px}
.phase li{padding-block:3px}
.phase .exit{margin:14px 0 0;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--soft)}

/* risks */
.rtable{inline-size:100%;border-collapse:collapse;font-size:14.5px}
.rtable th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--soft);text-align:start;padding:12px 14px}
.rtable td{padding:14px;border-block-end:1px solid var(--line);vertical-align:top}
.rtable td:first-child{font-weight:700;inline-size:30%}

/* sources */
.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.source{font-size:13.5px;padding-block-start:14px;border-block-start:1px solid var(--line);overflow-wrap:anywhere}
.source .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.source strong{display:block;font-size:14.5px;margin-block:4px}
.source p{margin:4px 0}
.footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding-block:26px 48px;font-size:12.5px;color:var(--muted)}

@keyframes flash{0%{box-shadow:0 0 0 0 rgba(16,184,166,.0)}20%{box-shadow:0 0 0 6px rgba(16,184,166,.45)}100%{box-shadow:0 0 0 0 rgba(16,184,166,0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .35s ease both}

@media (max-width:1000px){
  .cover-grid,.mapgrid,.grid3,.offers,.signal,.sources,.grid2,.mini3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .timeline{grid-template-columns:1fr 1fr}
  .phase:nth-child(2){border-inline-end:0}
  .phase:nth-child(-n+2){border-block-end:1px solid var(--line)}
  .detail{position:static}
  .top .label{display:none}
}
@media (max-width:700px){
  .catalog,.card-b,.flywheel,.timeline{grid-template-columns:1fr}
  .fw,.phase{border-inline-end:0;border-block-end:1px solid var(--line)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .shead{grid-template-columns:44px 1fr;gap:10px}
  .num{font-size:28px}
  .ctable thead,.rtable thead{display:none}
  .ctable tr,.rtable tr{display:block;border-block-start:1px solid var(--line);padding-block:10px}
  .ctable td,.rtable td{display:block;border:0;padding:6px 14px;inline-size:auto!important}
  .ctable td::before,.rtable td::before{content:attr(data-label);display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pbtn{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media print{
